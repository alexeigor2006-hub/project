<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Новый пользователь</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0f14;color:#e8ecf4;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#13161e;border:1px solid #252a38;border-radius:14px;padding:40px;width:460px}
    h1{font-size:20px;font-weight:800;margin-bottom:6px}
    .sub{font-size:13px;color:#6b7590;margin-bottom:28px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:11px;font-weight:700;color:#6b7590;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px}
    .form-control{width:100%;background:#1a1e29;border:1px solid #252a38;border-radius:8px;padding:10px 14px;color:#e8ecf4;font-family:inherit;font-size:14px}
    .form-control:focus{outline:none;border-color:#4f8ef7}
    select.form-control option{background:#1a1e29}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;text-decoration:none}
    .btn-primary{background:#4f8ef7;color:#fff}
    .btn-ghost{background:transparent;border:1px solid #252a38;color:#6b7590}
    .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
    .error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#f87171;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
    .success{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:#34d399;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
    .divider{height:1px;background:#252a38;margin:20px 0}
  </style>
</head>
<body>
<div class="card">
  <h1>➕ Новый пользователь</h1>
  <div class="sub">Создание учётной записи сотрудника</div>

  {% for msg in messages %}
    <div class="{% if msg.tags == 'error' %}error{% else %}success{% endif %}">{{ msg }}</div>
  {% endfor %}

  <form method="post">
    {% csrf_token %}
    <div class="row">
      <div class="form-group">
        <label class="form-label">Фамилия</label>
        <input type="text" name="last_name" class="form-control" placeholder="Иванов">
      </div>
      <div class="form-group">
        <label class="form-label">Имя</label>
        <input type="text" name="first_name" class="form-control" placeholder="Иван">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Имя пользователя (логин) *</label>
      <input type="text" name="username" class="form-control" placeholder="ivanov" required>
    </div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" placeholder="ivanov@university.ru">
    </div>

    <div class="row">
      <div class="form-group">
        <label class="form-label">Роль</label>
        <select name="role" class="form-control">
          <option value="teacher">Преподаватель</option>
          <option value="admin">Администратор</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Кафедра</label>
        <input type="text" name="department" class="form-control" placeholder="Кафедра ИТ">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Телефон</label>
      <input type="text" name="phone" class="form-control" placeholder="+7 (999) 123-45-67">
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="form-group">
        <label class="form-label">Пароль *</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Повтор пароля *</label>
        <input type="password" name="password2" class="form-control" required>
      </div>
    </div>

    <div class="btn-row">
      <a href="/admin-panel/users/" class="btn btn-ghost">Отмена</a>
      <button type="submit" class="btn btn-primary">Создать пользователя →</button>
    </div>
  </form>
</div>
</body>
</html>
