<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Cometa — Добавить ТМЦ</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0f14;color:#e8ecf4;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{background:#13161e;border:1px solid #252a38;border-radius:14px;padding:40px;width:520px}
    h1{font-size:20px;font-weight:800;margin-bottom:6px}
    .sub{font-size:13px;color:#6b7590;margin-bottom:28px}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:11px;font-weight:700;color:#6b7590;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px}
    .required{color:#f87171}
    .form-control{width:100%;background:#1a1e29;border:1px solid #252a38;border-radius:8px;padding:10px 14px;color:#e8ecf4;font-family:inherit;font-size:14px;transition:border-color .15s}
    .form-control:focus{outline:none;border-color:#4f8ef7}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;text-decoration:none;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-primary{background:#4f8ef7;color:#fff}
    .btn-ghost{background:transparent;border:1px solid #252a38;color:#6b7590}
    .btn-row{display:flex;gap:10px;justify-content:center;margin-top:24px}
    .divider{height:1px;background:#252a38;margin:20px 0}
    .error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#f87171;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
    .hint{font-size:11px;color:#6b7590;margin-top:4px}
  </style>
</head>
<body>
<div class="card">
  <h1>➕ Добавить ТМЦ</h1>
  <div class="sub">Новая единица оборудования будет закреплена за вами</div>

  {% for msg in messages %}
    {% if msg.tags == 'error' %}
    <div class="error">{{ msg }}</div>
    {% endif %}
  {% endfor %}

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label">Наименование <span class="required">*</span></label>
      <input type="text" name="name" class="form-control"
             placeholder="Ноутбук Dell Latitude 5520" required>
    </div>

    <div class="form-group">
      <label class="form-label">Инвентарный номер <span class="required">*</span></label>
      <input type="text" name="inventory_number" class="form-control"
             placeholder="ИТ-2024-0001" required>
    </div>

    <div class="form-group">
      <label class="form-label">Местоположение</label>
      <input type="text" name="location_name" class="form-control"
             placeholder="Аудитория 301">
      <div class="hint">Введите название аудитории или кабинета</div>
    </div>

    <div class="form-group">
      <label class="form-label">Дата приобретения</label>
      <input type="date" name="purchase_date" class="form-control">
    </div>

    <div class="btn-row">
      <a href="/dashboard/" class="btn btn-ghost">← Отмена</a>
      <button type="submit" class="btn btn-primary">Добавить ТМЦ →</button>
    </div>

  </form>
</div>
</body>
</html>
