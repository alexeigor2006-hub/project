<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0f14; color: #e8ecf4; font-family: system-ui, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #13161e; border: 1px solid #252a38; border-radius: 14px;
            padding: 40px; width: 380px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon { display: inline-flex; align-items: center; justify-content: center;
                 width: 52px; height: 52px; background: #4f8ef7; border-radius: 14px;
                 font-size: 26px; margin-bottom: 12px; }
    .logo-title { font-size: 24px; font-weight: 800; }
    .logo-sub { font-size: 12px; color: #6b7590; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: #6b7590;
                  text-transform: uppercase; letter-spacing: .7px; margin-bottom: 7px; }
    .form-control { width: 100%; background: #1a1e29; border: 1px solid #252a38;
                    border-radius: 8px; padding: 11px 14px; color: #e8ecf4;
                    font-family: inherit; font-size: 14px; }
    .form-control:focus { outline: none; border-color: #4f8ef7; }
    .btn-submit { width: 100%; padding: 13px; background: #4f8ef7; color: #fff;
                  border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
                  cursor: pointer; margin-top: 8px; font-family: inherit; }
    .btn-submit:hover { opacity: .85; }
    .error { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3);
             color: #f87171; border-radius: 8px; padding: 10px 14px;
             font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">☄</div>
      <div class="logo-title">Учёт товарно-материальных ценностей</div>
      
    </div>
    {% if form.errors %}
    <div class="error">Неверный логин или пароль.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Имя пользователя</label>
        <input type="text" name="username" class="form-control" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-submit">Войти →</button>
    </form>
  </div>
</body>
</html>
